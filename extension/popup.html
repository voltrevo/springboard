<!doctype html>
<meta charset="utf-8">
<title>Springboard</title>
<style>
  body {
    margin: 0;
    min-width: 240px;
    padding: 14px;
    background: #f6f6f4;
    color: #222;
    font: 13px/1.4 ui-monospace, monospace;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: #888;
  }
  button {
    width: 100%;
    padding: 9px 14px;
    background: #357edd;
    color: #fff;
    border: 0;
    border-radius: 6px;
    font: 600 12px/1 ui-monospace, monospace;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #4a90e2; }
  button:active { background: #2a6dc4; }
  button:disabled { background: #aaa; cursor: default; }
  p {
    margin: 12px 0 0;
    color: #666;
    min-height: 1em;
  }
</style>
<body>
  <h1>Springboard</h1>
  <button id="reset">Reset</button>
  <p id="status"></p>
</body>
<script src="popup.js"></script>
