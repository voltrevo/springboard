<!doctype html>
<title>springboard</title>
<script>
(() => {

const DB_NAME = 'springboard';
const STORE = 'kv';
const CONFIG_KEY = 'config';

const STYLES = `
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f6f6f4;
    color: #222;
    font: 14px/1.4 ui-monospace, monospace;
  }
  main {
    width: min(680px, 92vw);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: #888;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  textarea {
    width: 100%;
    height: 40vh;
    box-sizing: border-box;
    padding: 12px;
    background: #fff;
    color: #222;
    border: 1px solid #d4d4d0;
    border-radius: 6px;
    font: inherit;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: #357edd; }
  button {
    align-self: center;
    padding: 10px 28px;
    background: #357edd;
    color: #fff;
    border: 0;
    border-radius: 6px;
    font: 600 14px/1 ui-monospace, monospace;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #4a90e2; }
  button:active { background: #2a6dc4; }
  pre {
    margin: 0;
    padding: 12px;
    background: #fff;
    border: 1px solid #d4d4d0;
    border-radius: 6px;
    min-height: 1em;
    white-space: pre-wrap;
    word-break: break-all;
  }
  pre:empty { display: none; }
  a.gh {
    color: #888;
    display: flex;
    align-items: center;
    transition: color 0.15s;
  }
  a.gh:hover { color: #222; }
  a.gh svg { display: block; width: 22px; height: 22px; }
`;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(STORE).objectStore(STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbSet(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function sha256hex(text) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function log(msg) {
  const out = document.getElementById('out');
  if (out) out.append(msg + '\n');
}

function tearDownUI() {
  document.getElementById('springboard-style')?.remove();
  document.body.removeEventListener('dragover', onDragOver);
  document.body.removeEventListener('drop', onDrop);
  document.body.innerHTML = '';
}

function execute(source, input) {
  tearDownUI();
  setTimeout(() => new Function('input', source)(input), 35);
}

async function tryResolver(url, sha256, configText, input, state) {
  log('try ' + url);
  try {
    const body = await (await fetch(url)).text();
    if (state.matched) return;
    if (await sha256hex(body) !== sha256) return log('bad ' + url);
    state.matched = true;
    await idbSet(sha256, body);
    await idbSet(CONFIG_KEY, configText);
    log('match ' + url);
    execute(body, input);
  } catch {
    log('err ' + url);
  }
}

async function springboard(configText) {
  const { sha256, resolvers, input } = JSON.parse(configText);

  const cached = await idbGet(sha256);
  if (cached) return execute(cached, input);

  const shuffled = resolvers.slice().sort(() => Math.random() - 0.5);
  const state = { matched: false };
  let nextIndex = 0;

  function launchNext() {
    if (state.matched || nextIndex >= shuffled.length) return;
    tryResolver(shuffled[nextIndex++], sha256, configText, input, state);
    setTimeout(launchNext, 3000);
  }
  launchNext();
}

function showUI() {
  const style = document.createElement('style');
  style.id = 'springboard-style';
  style.textContent = STYLES;
  document.head.append(style);
  document.body.innerHTML = `
    <main>
      <h1>Springboard</h1>
      <textarea id="input" placeholder='{ "sha256": "...", "resolvers": ["https://..."], "input": ... }' autofocus></textarea>
      <button id="go">GO</button>
      <pre id="out"></pre>
    </main>`;
  const gh = document.createElement('a');
  gh.className = 'gh';
  gh.href = 'https://github.com/voltrevo/springboard';
  gh.target = '_blank';
  gh.rel = 'noopener';
  gh.setAttribute('aria-label', 'GitHub repository');
  gh.innerHTML = '<' + `svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg` + '>';
  document.querySelector('h1').append(gh);
  document.getElementById('go').onclick = onGoClick;
  document.body.addEventListener('dragover', onDragOver);
  document.body.addEventListener('drop', onDrop);
}

function onGoClick() {
  springboard(document.getElementById('input').value);
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
}

async function onDrop(e) {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const text = await file.text();
  const ta = document.getElementById('input');
  if (ta) ta.value = text;
  springboard(text);
}

function reset() {
  const req = indexedDB.deleteDatabase(DB_NAME);
  const done = () => location.reload();
  req.onsuccess = done;
  req.onerror = done;
  req.onblocked = done;
}

let resetHandler = null;

function installResetHotkey() {
  resetHandler = (e) => {
    if (e.key === 'Backspace' && e.shiftKey && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      if (confirm('Reset springboard? This clears the cached program and config.')) reset();
    }
  };
  window.addEventListener('keydown', resetHandler, true);
}

window.springboard = {
  disableResetHotkey() {
    if (!resetHandler) return;
    window.removeEventListener('keydown', resetHandler, true);
    resetHandler = null;
  },
};

async function start() {
  installResetHotkey();
  const stored = await idbGet(CONFIG_KEY);
  if (stored) springboard(stored);
  else showUI();
}

if (document.readyState === 'loading') addEventListener('DOMContentLoaded', start);
else start();

})();
</script>
