<!doctype html>
<title>springboard</title>
<script>
(() => {

const DB_NAME = 'springboard';
const STORE = 'kv';
const CONFIG_KEY = 'config';

const STYLES = `
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f6f6f4;
    color: #222;
    font: 14px/1.4 ui-monospace, monospace;
  }
  main {
    width: min(680px, 92vw);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: #888;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  textarea {
    width: 100%;
    height: 40vh;
    box-sizing: border-box;
    padding: 12px;
    background: #fff;
    color: #222;
    border: 1px solid #d4d4d0;
    border-radius: 6px;
    font: inherit;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: #357edd; }
  button {
    align-self: center;
    padding: 10px 28px;
    background: #357edd;
    color: #fff;
    border: 0;
    border-radius: 6px;
    font: 600 14px/1 ui-monospace, monospace;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #4a90e2; }
  button:active { background: #2a6dc4; }
  pre {
    margin: 0;
    padding: 12px;
    background: #fff;
    border: 1px solid #d4d4d0;
    border-radius: 6px;
    min-height: 1em;
    white-space: pre-wrap;
    word-break: break-all;
  }
  pre:empty { display: none; }
  a.gh {
    color: #888;
    display: flex;
    align-items: center;
    transition: color 0.15s;
  }
  a.gh:hover { color: #222; }
  a.gh svg { display: block; width: 22px; height: 22px; }
`;

// -- IndexedDB key-value (single-store) on any db name -------------------

function openKvDB(dbName) {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(dbName, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function kvGet(dbName, key) {
  const db = await openKvDB(dbName);
  try {
    return await new Promise((resolve, reject) => {
      const req = db.transaction(STORE).objectStore(STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  } finally { db.close(); }
}

async function kvSet(dbName, key, value) {
  const db = await openKvDB(dbName);
  try {
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } finally { db.close(); }
}

async function kvDelete(dbName, key) {
  const db = await openKvDB(dbName);
  try {
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } finally { db.close(); }
}

async function kvKeys(dbName) {
  const db = await openKvDB(dbName);
  try {
    return await new Promise((resolve, reject) => {
      const req = db.transaction(STORE).objectStore(STORE).getAllKeys();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  } finally { db.close(); }
}

function kvDrop(dbName) {
  return new Promise((resolve, reject) => {
    const req = indexedDB.deleteDatabase(dbName);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
    req.onblocked = () => {};
  });
}

// -- OPFS path API -------------------------------------------------------

function splitPath(path) {
  return String(path || '').split('/').filter(Boolean);
}

async function fsResolveDir(parts, { create = false } = {}) {
  let dir = await navigator.storage.getDirectory();
  for (const p of parts) dir = await dir.getDirectoryHandle(p, { create });
  return dir;
}

async function fsRead(path) {
  const parts = splitPath(path);
  if (!parts.length) throw new Error('fs.read: empty path');
  const name = parts.pop();
  const dir = await fsResolveDir(parts);
  const fh = await dir.getFileHandle(name);
  const file = await fh.getFile();
  return await file.arrayBuffer();
}

async function fsWrite(path, data) {
  const parts = splitPath(path);
  if (!parts.length) throw new Error('fs.write: empty path');
  const name = parts.pop();
  const dir = await fsResolveDir(parts, { create: true });
  const fh = await dir.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(data);
  await w.close();
}

async function fsDelete(path) {
  const parts = splitPath(path);
  if (!parts.length) {
    const root = await navigator.storage.getDirectory();
    for await (const name of root.keys()) await root.removeEntry(name, { recursive: true });
    return;
  }
  const name = parts.pop();
  const dir = await fsResolveDir(parts);
  await dir.removeEntry(name, { recursive: true });
}

async function fsList(path) {
  const dir = await fsResolveDir(splitPath(path));
  const out = [];
  for await (const [name, handle] of dir.entries()) out.push({ name, kind: handle.kind });
  return out;
}

async function fsMkdir(path) {
  await fsResolveDir(splitPath(path), { create: true });
}

// -- bridge dispatcher ---------------------------------------------------

let activeIframe = null;

window.addEventListener('message', async (e) => {
  if (!activeIframe || e.source !== activeIframe.contentWindow) return;
  const m = e.data;
  if (!m || m.sb !== 1 || m.id == null) return;

  let value, ok = true, errorMsg;
  try {
    switch (m.op) {
      case 'kv': {
        if (m.method === 'get') value = await kvGet(m.db, m.key);
        else if (m.method === 'set') value = await kvSet(m.db, m.key, m.value);
        else if (m.method === 'delete') value = await kvDelete(m.db, m.key);
        else if (m.method === 'keys') value = await kvKeys(m.db);
        else if (m.method === 'drop') value = await kvDrop(m.db);
        else throw new Error('kv: unknown method ' + m.method);
        break;
      }
      case 'fs': {
        if (m.method === 'read') value = await fsRead(m.path);
        else if (m.method === 'write') value = await fsWrite(m.path, m.data);
        else if (m.method === 'delete') value = await fsDelete(m.path);
        else if (m.method === 'list') value = await fsList(m.path);
        else if (m.method === 'mkdir') value = await fsMkdir(m.path);
        else throw new Error('fs: unknown method ' + m.method);
        break;
      }
      case 'fetch': {
        const res = await fetch(m.url, m.opts || undefined);
        const body = await res.arrayBuffer();
        value = {
          status: res.status,
          statusText: res.statusText,
          ok: res.ok,
          url: res.url,
          redirected: res.redirected,
          type: res.type,
          headers: [...res.headers],
          body,
        };
        break;
      }
      case 'chrome':
      case 'chromeOn':
      case 'chromeOff':
        throw new Error('chrome.* APIs are not available on this loader');
      case 'hideReset':
        document.getElementById('springboard-reset')?.remove();
        document.getElementById('springboard-reset-style')?.remove();
        value = null;
        break;
      default:
        throw new Error('unknown op: ' + m.op);
    }
  } catch (err) {
    ok = false;
    errorMsg = String(err && err.message || err);
  }

  try {
    if (ok) e.source.postMessage({ sb: 1, id: m.id, ok: true, value }, '*');
    else e.source.postMessage({ sb: 1, id: m.id, ok: false, error: errorMsg }, '*');
  } catch {}
});

// -- bridge library injected into the iframe srcdoc ----------------------

const BRIDGE_LIB = `(() => {
  const pending = new Map();
  const subs = new Map();
  let nextId = 1;

  addEventListener('message', (e) => {
    if (e.source !== parent) return;
    const m = e.data;
    if (!m || m.sb !== 1) return;
    if (m.id != null) {
      const p = pending.get(m.id);
      if (!p) return;
      pending.delete(m.id);
      if (m.ok) p.resolve(m.value);
      else p.reject(new Error(m.error));
      return;
    }
    if (m.event == null) return;
    const fn = subs.get(m.event);
    if (!fn) return;
    if (m.respId != null) {
      let responded = false;
      const sendResponse = (value) => {
        if (responded) return;
        responded = true;
        parent.postMessage({ sb: 1, respondTo: m.respId, value }, '*');
      };
      let keepOpen = false;
      try { keepOpen = fn(m.args[0], m.args[1], sendResponse); }
      catch (err) { console.error(err); }
      if (keepOpen !== true && !responded) {
        parent.postMessage({ sb: 1, respondTo: m.respId, close: true }, '*');
      }
    } else {
      try { fn(...m.args); } catch (err) { console.error(err); }
    }
  });

  function call(op, payload) {
    const id = nextId++;
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      parent.postMessage(Object.assign({ sb: 1, id, op }, payload), '*');
    });
  }

  const chromeFn = (path, ...args) => call('chrome', { path, args });
  chromeFn.on = (path, fn) => {
    const subId = nextId++;
    subs.set(subId, fn);
    call('chromeOn', { subId, path }).catch((err) => {
      subs.delete(subId);
      throw err;
    });
    return () => {
      subs.delete(subId);
      call('chromeOff', { subId }).catch(() => {});
    };
  };

  globalThis.springboard = {
    kv: {
      get:    (db, key)        => call('kv', { method: 'get', db, key }),
      set:    (db, key, value) => call('kv', { method: 'set', db, key, value }),
      delete: (db, key)        => call('kv', { method: 'delete', db, key }),
      keys:   (db)             => call('kv', { method: 'keys', db }),
      drop:   (db)             => call('kv', { method: 'drop', db }),
    },
    fs: {
      read:   (path)        => call('fs', { method: 'read', path }),
      write:  (path, data)  => call('fs', { method: 'write', path, data }),
      delete: (path)        => call('fs', { method: 'delete', path }),
      list:   (path)        => call('fs', { method: 'list', path }),
      mkdir:  (path)        => call('fs', { method: 'mkdir', path }),
    },
    chrome: chromeFn,
    fetch:  (url, opts) => call('fetch', { url, opts }),
    hideReset: () => call('hideReset', {}),
  };
})();`;

// -- loader --------------------------------------------------------------

async function sha256hex(text) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function log(msg) {
  const out = document.getElementById('out');
  if (out) out.append(msg + '\n');
}

function escapeForScript(s) {
  return s.replace(/<\/script/gi, '<\\/script').replace(/<!--/g, '<\\!--');
}

function execute(source, input) {
  document.getElementById('springboard-style')?.remove();
  document.body.removeEventListener('dragover', onDragOver);
  document.body.removeEventListener('drop', onDrop);
  document.body.innerHTML = '';
  document.body.style.cssText = 'margin:0;';
  document.documentElement.style.cssText = 'height:100%;';

  const iframe = document.createElement('iframe');
  iframe.sandbox = 'allow-scripts allow-modals allow-popups allow-forms allow-downloads';
  iframe.allow = 'camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; gamepad';
  iframe.style.cssText = 'border:0;width:100vw;height:100vh;display:block;';
  const inputJson = JSON.stringify(input ?? null).replace(/</g, '\\u003c');
  iframe.srcdoc =
    '<!doctype html><title>springboard</title><body></body>' +
    '<script>' + escapeForScript(BRIDGE_LIB) + '</' + 'script>' +
    '<script>(function(input){' + escapeForScript(source) + '})(' + inputJson + ');</' + 'script>';

  document.body.append(iframe);
  activeIframe = iframe;
}

async function tryResolver(url, sha256, configText, input, state) {
  log('try ' + url);
  try {
    const body = await (await fetch(url)).text();
    if (state.matched) return;
    if (await sha256hex(body) !== sha256) return log('bad ' + url);
    state.matched = true;
    await kvSet(DB_NAME, sha256, body);
    await kvSet(DB_NAME, CONFIG_KEY, configText);
    log('match ' + url);
    execute(body, input);
  } catch {
    log('err ' + url);
  }
}

async function springboard(configText) {
  const { sha256, resolvers, input } = JSON.parse(configText);

  const cached = await kvGet(DB_NAME, sha256);
  if (cached) return execute(cached, input);

  const shuffled = resolvers.slice().sort(() => Math.random() - 0.5);
  const state = { matched: false };
  let nextIndex = 0;

  function launchNext() {
    if (state.matched || nextIndex >= shuffled.length) return;
    tryResolver(shuffled[nextIndex++], sha256, configText, input, state);
    setTimeout(launchNext, 3000);
  }
  launchNext();
}

function showUI() {
  const style = document.createElement('style');
  style.id = 'springboard-style';
  style.textContent = STYLES;
  document.head.append(style);
  document.body.innerHTML = `
    <main>
      <h1>Springboard</h1>
      <textarea id="input" placeholder='{ "sha256": "...", "resolvers": ["https://..."], "input": ... }' autofocus></textarea>
      <button id="go">GO</button>
      <pre id="out"></pre>
    </main>`;
  const gh = document.createElement('a');
  gh.className = 'gh';
  gh.href = 'https://github.com/voltrevo/springboard';
  gh.target = '_blank';
  gh.rel = 'noopener';
  gh.setAttribute('aria-label', 'GitHub repository');
  gh.innerHTML = '<' + `svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg` + '>';
  document.querySelector('h1').append(gh);
  document.getElementById('go').onclick = onGoClick;
  document.body.addEventListener('dragover', onDragOver);
  document.body.addEventListener('drop', onDrop);
}

function onGoClick() {
  springboard(document.getElementById('input').value);
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
}

async function onDrop(e) {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const text = await file.text();
  const ta = document.getElementById('input');
  if (ta) ta.value = text;
  springboard(text);
}

async function reset() {
  const dbs = await indexedDB.databases?.() ?? [{ name: DB_NAME }];
  await Promise.all(dbs.map(({ name }) => new Promise((resolve) => {
    if (!name) return resolve();
    const req = indexedDB.deleteDatabase(name);
    req.onsuccess = () => resolve();
    req.onerror = () => resolve();
    req.onblocked = () => {};
  })));
  try {
    const root = await navigator.storage.getDirectory();
    for await (const name of root.keys()) {
      try { await root.removeEntry(name, { recursive: true }); } catch {}
    }
  } catch {}
  location.reload();
}

const RESET_STYLE = `
  #springboard-reset {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 2147483647;
    color: #888;
    background: transparent;
    border: 0;
    padding: 4px;
    cursor: pointer;
    transition: color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #springboard-reset:hover { color: #222; }
  #springboard-reset svg { display: block; width: 20px; height: 20px; }
`;

function onResetClick() {
  if (confirm('Reset springboard? Wipes all stored data.')) reset();
}

function mountResetIcon() {
  const style = document.createElement('style');
  style.id = 'springboard-reset-style';
  style.textContent = RESET_STYLE;
  document.head.append(style);

  const btn = document.createElement('button');
  btn.id = 'springboard-reset';
  btn.title = 'Reset springboard';
  btn.setAttribute('aria-label', 'Reset springboard');
  btn.innerHTML = '<' + 'svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.74 10h-2.07A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg' + '>';
  btn.onclick = onResetClick;
  document.documentElement.append(btn);
}

async function start() {
  mountResetIcon();
  const stored = await kvGet(DB_NAME, CONFIG_KEY);
  if (stored) springboard(stored);
  else showUI();
}

if (document.readyState === 'loading') addEventListener('DOMContentLoaded', start);
else start();

})();
</script>
