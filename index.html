<!doctype html>
<title>springboard</title>
<script>
const CONFIG_KEY = 'springboard:config'

const STYLES = `
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f6f6f4;
    color: #222;
    font: 14px/1.4 ui-monospace, monospace;
  }
  main {
    width: min(680px, 92vw);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-align: center;
    color: #888;
  }
  textarea {
    width: 100%;
    height: 40vh;
    box-sizing: border-box;
    padding: 12px;
    background: #fff;
    color: #222;
    border: 1px solid #d4d4d0;
    border-radius: 6px;
    font: inherit;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: #357edd; }
  button {
    align-self: center;
    padding: 10px 28px;
    background: #357edd;
    color: #fff;
    border: 0;
    border-radius: 6px;
    font: 600 14px/1 ui-monospace, monospace;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #4a90e2; }
  button:active { background: #2a6dc4; }
  pre {
    margin: 0;
    padding: 12px;
    background: #fff;
    border: 1px solid #d4d4d0;
    border-radius: 6px;
    min-height: 1em;
    white-space: pre-wrap;
    word-break: break-all;
  }
  pre:empty { display: none; }
`

const sha256hex = async text => {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text))
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('')
}

const log = msg => {
  const out = document.getElementById('out')
  if (out) out.append(msg + '\n')
}

const tearDownUI = () => {
  document.getElementById('springboard-style')?.remove()
  document.body.innerHTML = ''
}

const execute = source => {
  tearDownUI()
  new Function(source)()
}

const springboard = async config => {
  const [hash, ...urls] = config.trim().split(/\s+/)

  const cached = localStorage[hash]
  if (cached) return execute(cached)

  const shuffled = urls.slice().sort(() => Math.random() - 0.5)
  let matched = false
  let nextIndex = 0

  const attempt = async url => {
    log('try ' + url)
    try {
      const body = await (await fetch(url)).text()
      if (matched) return
      if (await sha256hex(body) !== hash) return log('bad ' + url)
      matched = true
      localStorage[hash] = body
      localStorage[CONFIG_KEY] = config
      log('match ' + url)
      execute(body)
    } catch {
      log('err ' + url)
    }
  }

  const launchNext = () => {
    if (matched || nextIndex >= shuffled.length) return
    attempt(shuffled[nextIndex++])
    setTimeout(launchNext, 3000)
  }
  launchNext()
}

const showUI = () => {
  const style = document.createElement('style')
  style.id = 'springboard-style'
  style.textContent = STYLES
  document.head.append(style)
  document.body.innerHTML = `
    <main>
      <h1>springboard</h1>
      <textarea id="input" placeholder="<sha256>&#10;<url>&#10;<url>&#10;..." autofocus></textarea>
      <button id="go">GO</button>
      <pre id="out"></pre>
    </main>`
  document.getElementById('go').onclick = () =>
    springboard(document.getElementById('input').value)
}

const start = () => {
  const stored = localStorage[CONFIG_KEY]
  if (stored) springboard(stored)
  else showUI()
}

if (document.readyState === 'loading') addEventListener('DOMContentLoaded', start)
else start()
</script>
